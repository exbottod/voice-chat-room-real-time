<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Zeus Rezo</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#04120f;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#f6e7c1}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;
    background:url(bg.png) center/cover no-repeat,#04120f}
  #app:before{content:"";position:absolute;inset:0;background:
    radial-gradient(120% 80% at 50% 0%,rgba(0,0,0,.15),rgba(2,14,12,.78) 70%),
    linear-gradient(180deg,rgba(3,20,17,.35),rgba(2,12,10,.9))}
  .wrap{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;
    padding:calc(8px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
  /* ---------- bar atas ---------- */
  .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .badge{display:flex;align-items:center;gap:6px;background:rgba(6,26,22,.82);
    border:1px solid rgba(226,184,86,.45);border-radius:999px;padding:5px 11px 5px 6px;
    font-size:12px;letter-spacing:.3px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .badge img,.badge .ava{width:20px;height:20px;border-radius:50%;background:#17423a;
    display:grid;place-items:center;font-size:10px;color:#e2b856}
  .saldo{margin-left:auto;display:flex;align-items:center;gap:6px;
    background:linear-gradient(180deg,#1b4d43,#0b2a25);border:1px solid rgba(226,184,86,.55);
    border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;
    box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .saldo b{color:#ffd76e}
  .coin{width:15px;height:15px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#ffeaa0,#e2b856 60%,#8a6a1e);flex:0 0 auto}
  /* ---------- judul ---------- */
  .judul{text-align:center;font-size:15px;font-weight:800;letter-spacing:3px;
    color:#ffd76e;text-shadow:0 2px 0 #6b4c12,0 0 18px rgba(255,196,74,.45);margin:2px 0 8px}
  /* ---------- papan ---------- */
  .papan{position:relative;border-radius:16px;padding:6px;
    background:linear-gradient(180deg,rgba(10,44,38,.94),rgba(4,20,18,.96));
    border:1px solid rgba(226,184,86,.5);
    box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 0 24px rgba(0,0,0,.5)}
  .kisi{position:relative;display:grid;grid-template-columns:repeat(5,1fr);
    gap:4px;border-radius:12px;overflow:hidden;background:rgba(2,14,12,.75)}
  .spin-col{display:flex;flex-direction:column;gap:4px;will-change:transform}
  .cell{position:relative;aspect-ratio:1/1.06;border-radius:10px;
    background:linear-gradient(180deg,rgba(22,64,56,.55),rgba(8,32,28,.6));
    border:1px solid rgba(255,255,255,.07);display:grid;place-items:center;overflow:hidden}
  .cell svg{width:82%;height:82%;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
  .cell.hit{animation:hit .55s ease-in-out infinite alternate}
  .cell.hit:after{content:"";position:absolute;inset:0;border-radius:10px;
    box-shadow:inset 0 0 0 2px #ffd76e,inset 0 0 18px rgba(255,215,110,.65)}
  @keyframes hit{from{transform:scale(1)}to{transform:scale(1.06)}}
  .garis{position:absolute;inset:0;pointer-events:none}
  /* ---------- kemenangan ---------- */
  .menang{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);
    opacity:0;pointer-events:none;text-align:center;z-index:6;transition:.28s}
  .menang.tampil{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .menang .kali{font-size:38px;font-weight:900;color:#ffe27a;letter-spacing:1px;
    text-shadow:0 0 26px rgba(255,205,80,.85),0 4px 0 #7a5310}
  .menang .coin2{font-size:15px;font-weight:700;color:#fff6d6;text-shadow:0 2px 8px #000}
  /* ---------- kontrol ---------- */
  .kontrole{margin-top:auto}
  .kontrol{display:flex;flex-direction:column;gap:8px;padding-top:10px}
  .taruhan{display:flex;align-items:center;gap:6px;justify-content:center}
  .tombol-pil{background:rgba(8,34,29,.92);border:1px solid rgba(226,184,86,.45);
    color:#ffd76e;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;min-width:38px}
  .tombol-pil:active{transform:scale(.95)}
  .nilai{min-width:104px;text-align:center;font-weight:800;font-size:16px;color:#fff3cf;
    background:rgba(4,20,18,.85);border:1px solid rgba(226,184,86,.3);border-radius:999px;padding:8px 4px}
  .spin{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:900;
    letter-spacing:2px;color:#3d2a06;background:linear-gradient(180deg,#ffe27a,#e2b856 60%,#b98d2a);
    box-shadow:0 6px 0 #7a5a12,0 12px 24px rgba(0,0,0,.5)}
  .spin:disabled{filter:grayscale(.55) brightness(.85);box-shadow:0 4px 0 #5a4410}
  .spin:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 #7a5a12}
  .bawah{display:flex;gap:8px}
  .kecil{flex:1;background:rgba(8,34,29,.9);border:1px solid rgba(226,184,86,.3);
    color:#f6e7c1;border-radius:12px;padding:9px;font-size:12px;font-weight:700}
  .info{position:absolute;left:0;right:0;top:44%;text-align:center;z-index:8;
    font-size:13px;font-weight:700;color:#ffe27a;text-shadow:0 2px 8px #000;opacity:0;transition:.25s}
  .info.tampil{opacity:1}
  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:18px;
    background:rgba(1,8,7,.82)}
  .modal.buka{display:grid}
  .modal .isi{width:100%;max-width:360px;max-height:78vh;overflow:auto;border-radius:16px;
    background:linear-gradient(180deg,#0d322b,#051a16);border:1px solid rgba(226,184,86,.5);padding:14px}
  .modal h3{margin:0 0 10px;font-size:14px;color:#ffd76e;letter-spacing:1px}
  .baris{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px}
  .baris svg{width:26px;height:26px}
  .baris span{margin-left:auto;color:#ffd76e;font-weight:700}
  .tutup{margin-top:12px;width:100%;border:0;border-radius:10px;padding:11px;font-weight:800;
    background:linear-gradient(180deg,#ffe27a,#d9ab4a);color:#3d2a06}
  .demo{position:absolute;top:6px;right:8px;font-size:9px;letter-spacing:1px;color:#ffb4a0;z-index:9}
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <div class="top">
      <div class="badge"><div class="ava" id="ava">Z</div><span id="nama">Pemain</span></div>
      <div class="saldo"><div class="coin"></div><b id="saldo">0</b></div>
    </div>
    <div class="judul">ZEUS REZO</div>

    <div class="papan">
      <div class="kisi" id="kisi"></div>
      <div class="menang" id="menang">
        <div class="kali" id="kaliTxt">x0</div>
        <div class="coin2" id="winTxt">0 coin</div>
      </div>
      <div class="info" id="info"></div>
      <div class="demo" id="demo" style="display:none">DEMO</div>
    </div>

    <div class="kontrole">
      <div class="kontrol">
        <div class="taruhan">
          <button class="tombol-pil" id="kurang">−</button>
          <div class="nilai" id="taruhan">1.000</div>
          <button class="tombol-pil" id="tambah">+</button>
          <button class="tombol-pil" id="maks" style="font-size:11px;padding:8px 10px">MAX</button>
        </div>
        <button class="spin" id="spin">PUTAR</button>
        <div class="bawah">
          <button class="kecil" id="bPay">Bayaran</button>
          <button class="kecil" id="bUlang">Muat ulang saldo</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="isi">
    <h3>BAYARAN (x taruhan)</h3>
    <div id="daftarBayar"></div>
    <button class="tutup" id="tutup">Tutup</button>
  </div>
</div>

<script>
/* ================= simbol ================= */
const EMAS = 'url(#gEmas)', EMAS2 = 'url(#gEmas2)';
function svg(dalam) {
  return '<svg viewBox="0 0 100 100"><defs>'
    + '<linearGradient id="gEmas" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#f0c860"/>'
    + '<stop offset="1" stop-color="#a8792a"/></linearGradient>'
    + '<linearGradient id="gEmas2" x1="0" y1="0" x2="1" y2="1">'
    + '<stop offset="0" stop-color="#ffe9a6"/><stop offset="1" stop-color="#c1912f"/></linearGradient>'
    + '<radialGradient id="gMerah"><stop offset="0" stop-color="#ff8f7a"/>'
    + '<stop offset="1" stop-color="#a01f2c"/></radialGradient>'
    + '</defs>' + dalam + '</svg>';
}
const SIMBOL = {
  zeus: svg(
    '<circle cx="50" cy="50" r="42" fill="#0d3b34" stroke="url(#gEmas)" stroke-width="3"/>'
    + '<path d="M32 44c0-11 8-18 18-18s18 7 18 18c0 4-2 7-4 9 4 3 6 8 6 13 0 3-2 5-5 5H35c-3 0-5-2-5-5 0-5 2-10 6-13-2-2-4-5-4-9z" fill="url(#gEmas)"/>'
    + '<circle cx="43" cy="43" r="2.6" fill="#0d3b34"/><circle cx="57" cy="43" r="2.6" fill="#0d3b34"/>'
    + '<path d="M36 34l8-6 6 5 6-5 8 6-4 4H40z" fill="url(#gEmas2)"/>'
    + '<path d="M44 58h12l-2 12-4-4-4 4z" fill="#0d3b34" opacity=".55"/>'),
  mahkota: svg(
    '<path d="M20 68l6-30 14 14 10-20 10 20 14-14 6 30z" fill="url(#gEmas)" stroke="#7a5310" stroke-width="2"/>'
    + '<rect x="20" y="70" width="60" height="10" rx="4" fill="url(#gEmas2)"/>'
    + '<circle cx="50" cy="52" r="4" fill="#a01f2c"/>'),
  petir: svg(
    '<path d="M56 8L26 56h20l-6 36 34-52H52z" fill="url(#gEmas)" stroke="#7a5310" stroke-width="2.5"/>'),
  kuil: svg(
    '<path d="M50 8L14 32h72z" fill="url(#gEmas)"/>'
    + '<rect x="20" y="36" width="60" height="8" fill="url(#gEmas2)"/>'
    + '<rect x="24" y="46" width="9" height="34" fill="url(#gEmas)"/>'
    + '<rect x="45" y="46" width="9" height="34" fill="url(#gEmas)"/>'
    + '<rect x="66" y="46" width="9" height="34" fill="url(#gEmas)"/>'
    + '<rect x="16" y="82" width="68" height="9" rx="3" fill="url(#gEmas2)"/>'),
  helm: svg(
    '<path d="M28 50c0-14 10-24 22-24s22 10 22 24v14c0 12-9 20-22 20s-22-8-22-20z" fill="url(#gEmas)" stroke="#7a5310" stroke-width="2"/>'
    + '<path d="M50 26v58" stroke="#7a5310" stroke-width="3"/>'
    + '<path d="M28 46h14M58 46h14" stroke="#0d3b34" stroke-width="5" stroke-linecap="round"/>'
    + '<path d="M40 78c4-4 16-4 20 0" stroke="#0d3b34" stroke-width="4" fill="none"/>'),
  piala: svg(
    '<path d="M32 22h36v14c0 12-8 20-18 20s-18-8-18-20z" fill="url(#gEmas)"/>'
    + '<path d="M32 26h-8c0 12 6 18 12 19M68 26h8c0 12-6 18-12 19" stroke="url(#gEmas2)" stroke-width="3" fill="none"/>'
    + '<rect x="46" y="56" width="8" height="16" fill="url(#gEmas2)"/>'
    + '<rect x="34" y="72" width="32" height="9" rx="4" fill="url(#gEmas)"/>'),
  cincin: svg(
    '<circle cx="50" cy="58" r="24" fill="none" stroke="url(#gEmas)" stroke-width="9"/>'
    + '<path d="M50 30l8-14 8 14-8 12z" fill="#5fe0d0" stroke="#1d6f66" stroke-width="2"/>'),
  permata: svg(
    '<path d="M50 14l24 22-24 50L26 36z" fill="url(#gMerah)" stroke="#ffd76e" stroke-width="2.5"/>'
    + '<path d="M26 36h48M50 14v72" stroke="rgba(255,255,255,.45)" stroke-width="1.6"/>'),
};
const URUT_SIMBOL = ['zeus', 'mahkota', 'petir', 'kuil', 'helm', 'piala', 'cincin', 'permata'];
const BAYAR = {
  zeus: [9.5, 38, 115], mahkota: [6.5, 29, 92], petir: [5, 19, 58], kuil: [4, 14, 38],
  helm: [3, 9.5, 29], piala: [2.4, 7, 24], cincin: [2, 6, 19], permata: [1.4, 4.8, 14],
};

/* ================= konfigurasi ================= */
const API = [
  'https://rezo-wallet.bangexx01.workers.dev',
  'https://43-156-99-4.sslip.io',
];
const kode = new URLSearchParams(location.search).get('code') || '';
let saldo = 0, taruhan = 1000, main = false, demo = !kode;
const TARUHAN = [100, 500, 1000, 5000, 10000, 50000, 100000, 500000, 1000000];

const $ = (id) => document.getElementById(id);
const rupiah = (n) => Number(n || 0).toLocaleString('id-ID');

/* ================= papan ================= */
const kisi = $('kisi');
const kolom = [];
for (let c = 0; c < 5; c++) {
  const d = document.createElement('div');
  d.className = 'spin-col';
  kisi.appendChild(d);
  kolom.push(d);
}
function sel(nama) {
  const d = document.createElement('div');
  d.className = 'cell';
  d.innerHTML = SIMBOL[nama] || SIMBOL.permata;
  return d;
}
/** isi awal: baris acak supaya papan tidak kosong */
function isiPapan(grid) {
  for (let c = 0; c < 5; c++) {
    const k = kolom[c];
    k.style.transition = 'none';
    k.style.transform = 'translateY(0)';
    k.innerHTML = '';
    for (let r = 0; r < 3; r++) k.appendChild(sel(URUT_SIMBOL[grid[r][c]]));
  }
}
let gridAwal = [];
for (let r = 0; r < 3; r++) {
  gridAwal.push([]);
  for (let c = 0; c < 5; c++) gridAwal[r].push(Math.floor(Math.random() * 8));
}
isiPapan(gridAwal);

/* ================= animasi putar ================= */
async function putarAnimasi(grid) {
  const janji = [];
  for (let c = 0; c < 5; c++) {
    const k = kolom[c];
    // strip panjang: isi acak lalu hasil akhir di bawah
    const strip = document.createElement('div');
    strip.style.transition = 'transform .55s cubic-bezier(.22,.61,.36,1)';
    strip.style.transform = 'translateY(0)';
    for (let i = 0; i < 9; i++) strip.appendChild(sel(URUT_SIMBOL[Math.floor(Math.random() * 8)]));
    for (let r = 0; r < 3; r++) strip.appendChild(sel(URUT_SIMBOL[grid[r][c]]));
    k.innerHTML = '';
    k.appendChild(strip);
    const tinggi = strip.firstChild.getBoundingClientRect().height + 4;
    const tunda = c * 90;
    janji.push(new Promise((res) => setTimeout(() => {
      strip.style.transition = 'transform .62s cubic-bezier(.2,.7,.3,1)';
      strip.style.transform = 'translateY(-' + (tinggi * 9) + 'px)';
      setTimeout(() => {
        k.innerHTML = '';
        for (let r = 0; r < 3; r++) k.appendChild(sel(URUT_SIMBOL[grid[r][c]]));
        res();
      }, 640);
    }, tunda)));
  }
  await Promise.all(janji);
}

/** sorot sel yang menang */
function sorot(lines) {
  if (!lines || !lines.length) return;
  const posisi = {
    0: [[0, 0], [0, 1], [0, 2], [0, 3], [0, 4]],
    1: [[1, 0], [1, 1], [1, 2], [1, 3], [1, 4]],
    2: [[2, 0], [2, 1], [2, 2], [2, 3], [2, 4]],
    3: [[0, 0], [1, 1], [2, 2], [1, 3], [0, 4]],
    4: [[2, 0], [1, 1], [0, 2], [1, 3], [2, 4]],
  };
  lines.forEach((l) => {
    (posisi[l.line] || []).slice(0, l.count).forEach(([r, c]) => {
      const sel2 = kolom[c].children[r];
      if (sel2) sel2.classList.add('hit');
    });
  });
}
function bersihSorot() {
  document.querySelectorAll('.cell.hit').forEach((e) => e.classList.remove('hit'));
}

/* ================= jaringan ================= */
async function api(path, body) {
  let err = null;
  for (const dasar of API) {
    try {
      const r = await fetch(dasar + path, {
        method: 'POST',
        headers: { 'content-type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify(body || {}),
      });
      const j = await r.json();
      if (j && (j.ok === 1 || j.ok === 0 || j.code === 0)) return j;
      err = (j && (j.e || j.message)) || 'Balasan server tidak dikenal';
    } catch (e) { err = 'Tidak bisa menghubungi server'; }
  }
  throw new Error(err || 'Gagal');
}

function pesan(t) {
  const el = $('info');
  el.textContent = t;
  el.classList.add('tampil');
  clearTimeout(pesan.t);
  pesan.t = setTimeout(() => el.classList.remove('tampil'), 2200);
}

async function muatSaldo() {
  if (demo) { saldo = 1000000; $('demo').style.display = 'block'; $('saldo').textContent = rupiah(saldo); return; }
  try {
    const j = await api('/g/state', { code: kode });
    saldo = Number(j.coins ?? j.w?.coins ?? 0);
    if (j.name) $('nama').textContent = j.name;
    if (j.avatar) $('ava').innerHTML = '<img src="' + j.avatar + '" style="width:20px;height:20px;border-radius:50%">';
    $('saldo').textContent = rupiah(saldo);
  } catch (e) { pesan(e.message); }
}

/* ================= putaran ================= */
async function putar() {
  if (main) return;
  if (taruhan > saldo) { pesan('Coin tidak cukup'); return; }
  main = true;
  $('spin').disabled = true;
  bersihSorot();
  $('menang').classList.remove('tampil');

  let hasil;
  if (demo) {
    // mode demo: hasil dihitung di HP, tidak menyentuh coin asli
    const g = [];
    for (let r = 0; r < 3; r++) { g.push([]); for (let c = 0; c < 5; c++) g[r].push(Math.floor(Math.random() * 8)); }
    let kali = 0, lines = [];
    const cek = (ln, idx) => {
      const b = ln[0]; let n = 1;
      for (let i = 1; i < 5; i++) { if (ln[i] === b || ln[i] === 1) n++; else break; }
      if (n >= 3) { const p = BAYAR[URUT_SIMBOL[b]][n - 3]; kali += p; lines.push({ line: idx, count: n, pay: p }); }
    };
    for (let r = 0; r < 3; r++) cek(g[r], r);
    cek([g[0][0], g[1][1], g[2][2], g[1][3], g[0][4]], 3);
    cek([g[2][0], g[1][1], g[0][2], g[1][3], g[2][4]], 4);
    hasil = { grid: g, kali, win: Math.floor(taruhan * kali), lines };
    saldo = saldo - taruhan + hasil.win;
    $('saldo').textContent = rupiah(saldo);
  } else {
    try {
      const j = await api('/g/spin', { code: kode, bet: taruhan });
      if (j.ok === 0) throw new Error(j.e || 'Putaran ditolak');
      hasil = j;
      saldo = Number(j.coins ?? 0);
    } catch (e) {
      pesan(e.message);
      main = false; $('spin').disabled = false;
      return;
    }
  }

  await putarAnimasi(hasil.grid);
  await new Promise((r) => setTimeout(r, 120));

  if (hasil.win > 0) {
    sorot(hasil.lines);
    $('kaliTxt').textContent = 'x' + (Number(hasil.kali) % 1 === 0 ? Number(hasil.kali) : Number(hasil.kali).toFixed(1));
    $('winTxt').textContent = '+' + rupiah(hasil.win) + ' coin';
    $('menang').classList.add('tampil');
    getar(hasil.kali >= 10 ? 90 : 28);
    setTimeout(() => $('menang').classList.remove('tampil'), 1900);
  }
  $('saldo').textContent = rupiah(saldo);
  main = false; $('spin').disabled = false;
}

function getar(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}

/* ================= bayaran ================= */
function daftarBayar() {
  const box = $('daftarBayar');
  box.innerHTML = URUT_SIMBOL.map((n) => {
    const p = BAYAR[n];
    return '<div class="baris">' + SIMBOL[n] + '<b style="text-transform:capitalize">' + n + '</b>'
      + '<span>3x ' + p[0] + ' · 4x ' + p[1] + ' · 5x ' + p[2] + '</span></div>';
  }).join('');
}

/* ================= kontrol ================= */
function aturTaruhan(arah) {
  const i = TARUHAN.indexOf(taruhan);
  let j = i + arah;
  if (j < 0) j = 0;
  if (j > TARUHAN.length - 1) j = TARUHAN.length - 1;
  taruhan = TARUHAN[j];
  $('taruhan').textContent = rupiah(taruhan);
}
$('kurang').onclick = () => aturTaruhan(-1);
$('tambah').onclick = () => aturTaruhan(1);
$('maks').onclick = () => {
  let t = 100;
  for (const v of TARUHAN) if (v <= saldo) t = v;
  taruhan = t;
  $('taruhan').textContent = rupiah(taruhan);
};
$('spin').onclick = putar;
$('bPay').onclick = () => { daftarBayar(); $('modal').classList.add('buka'); };
$('tutup').onclick = () => $('modal').classList.remove('buka');
$('bUlang').onclick = () => { muatSaldo(); pesan('Saldo dimuat ulang'); };

$('taruhan').textContent = rupiah(taruhan);
muatSaldo();
</script>
</body>
</html>
