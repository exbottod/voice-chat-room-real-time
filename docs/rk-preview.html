<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=420">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,sans-serif}
body{width:420px;height:820px;background:#050b1c;display:flex;align-items:flex-end}
.panel{width:100%;height:82%;background:linear-gradient(180deg,#0a2a66,#061b45 45%,#04122e);
border:1.5px solid rgba(212,175,55,.85);border-radius:18px 18px 0 0;padding:12px 14px 22px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between}
.rbtn{width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,#2b5fb8,#123470);
border:1.5px solid #d4af37;display:flex;align-items:center;justify-content:center;color:#ffe08a;font-weight:900;font-size:17px}
.ttl{color:#ffe08a;font-size:32px;font-weight:900;letter-spacing:.5px}
.rockets{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.rk{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2a6bd6,#0b2a5e);
border:1px solid rgba(127,211,255,.5);display:flex;align-items:center;justify-content:center;font-size:30px}
.rk.off{opacity:.55}
.rk.on{box-shadow:0 0 14px rgba(127,211,255,.75);border-color:#7fd3ff;transform:scale(1.1)}
.arw{color:#ffd54f;font-size:18px;font-weight:900}
.bar{margin-top:14px;height:16px;border-radius:50px;background:#0b1b3e;border:1.5px solid #d4af37;overflow:hidden}
.fill{height:100%;width:64%;background:linear-gradient(90deg,#ff8a00,#ffd54f);border-radius:50px}
.lbl{display:flex;justify-content:space-between;margin-top:3px;font-size:12px;color:#fff}
.lbl .dim{color:#9fb6d9;font-size:11px}
.box{margin-top:12px;border:1.5px solid rgba(212,175,55,.85);border-radius:10px;background:#0a1f4d;padding:10px}
.box h4{color:#ffe08a;font-size:12px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{height:86px;border-radius:8px;background:#0e2a63;border:1px solid #3f67b5;display:flex;align-items:center;justify-content:center;font-size:38px}
.seats{position:absolute;top:0;left:0;right:0;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;opacity:.25}
.seat{height:52px;border-radius:26px;background:#123;border:1px solid #2a4a7a;display:flex;align-items:center;justify-content:center;font-size:11px;color:#8fb}
</style></head><body>
<div class="seats"><div class="seat">MC</div><div class="seat">No.2</div><div class="seat">No.3</div><div class="seat">No.4</div>
<div class="seat">No.5</div><div class="seat">No.6</div><div class="seat">No.7</div><div class="seat">No.8</div></div>
<div class="panel">
  <div class="top"><div class="rbtn">?</div><div class="ttl">Rocket</div>
    <div style="display:flex;gap:8px"><div class="rbtn">🏆</div><div class="rbtn">🎁</div></div></div>
  <div class="rockets">
    <div class="rk off">🚀</div><div class="arw">»</div>
    <div class="rk on">🚀</div><div class="arw">»</div>
    <div class="rk off">🚀</div><div class="arw">»</div>
    <div class="rk off">🚀</div><div class="arw">»</div>
    <div class="rk off">🚀</div></div>
  <div class="bar"><div class="fill"></div></div>
  <div class="lbl"><span>lv.2</span><span class="dim">320 jt / 500 jt</span><span>lv.3</span></div>
  <div class="box"><h4>Hadiah roket Lv.2</h4>
    <div class="grid">
      <div class="cell">💰</div><div class="cell">💎</div><div class="cell">👑</div>
      <div class="cell">🎁</div><div class="cell">🏆</div><div class="cell">🪙</div>
    </div></div>
</div></body></html>
