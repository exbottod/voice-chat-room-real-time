<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REZO CHAT VOICE</title></head>
<body style="font-family:sans-serif;max-width:700px;margin:32px auto;padding:0 16px;text-align:center;background:#0d1117;color:#e6edf3">
<h1 style="margin-bottom:4px">REZO CHAT VOICE</h1>
<p style="color:#9fb6d9;margin-top:0">Aplikasi Android untuk chat suara dengan teman.</p>
<p><a href="https://github.com/exbottod/voice-chat-room-real-time/releases/latest/download/REZO-CHAT-VOICE.apk" style="display:inline-block;background:#d4af37;color:#000;padding:14px 28px;border-radius:12px;font-weight:bold;text-decoration:none">Unduh APK Terbaru</a></p>
<p><a href="preview.html" style="display:inline-block;background:#238636;color:#fff;padding:12px 24px;border-radius:12px;font-weight:bold;text-decoration:none">Preview tanpa install</a></p>
<p id="kode" style="color:#9fb6d9"></p>

<div style="text-align:left;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px 16px;margin:18px 0">
  <b>Isi APK terbaru</b> <span id="cek-waktu" style="color:#8b949e;font-size:13px"></span>
  <div id="status" style="margin-top:8px;font-weight:bold"></div>
  <div id="ringkas" style="color:#c9d1d9;font-size:14px;margin-top:8px">Memuat…</div>
  <div id="fitur" style="margin-top:10px;font-size:14px;line-height:1.9"></div>
</div>

<p style="font-size:13px"><a href="https://github.com/exbottod/voice-chat-room-real-time/actions" style="color:#58a6ff">Riwayat build</a> &middot; <a href="privacy.html" style="color:#58a6ff">Kebijakan Privasi</a></p>
<script>
var k=new URLSearchParams(location.search).get("invite");
if(k&&/^\d+$/.test(k)){document.getElementById("kode").textContent="Kode undangan: "+k+" (masukkan di menu Undang teman setelah login)";}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

fetch("build-info.json?t="+Date.now()).then(function(r){return r.json()}).then(function(d){
  document.getElementById("ringkas").innerHTML =
    "Versi <b>"+esc(d.versi||"?")+"</b> &middot; "+esc(d.ukuran_mb)+" MB &middot; commit "+esc(d.commit||"-")+
    "<br>Aset: "+esc(d.aset_total)+" file, roket "+esc(d.aset_roket)+" file"+
    "<br><span style=\"color:#8b949e;font-size:12px\">sidik jari "+esc((d.sha256||"").slice(0,16))+"</span>";
  if(d.waktu){
    try { document.getElementById("cek-waktu").textContent = "· " + new Date(d.waktu).toLocaleString("id-ID"); } catch(e){}
  }
  var st=document.getElementById("status");
  if(d.status==="gagal"){
    st.innerHTML="<span style=\"color:#f85149\">Build gagal</span>";
  } else if((d.masalah||[]).length){
    st.innerHTML="<span style=\"color:#d29922\">Build jadi, tapi ada yang tidak masuk</span>";
  } else {
    st.innerHTML="<span style=\"color:#3fb950\">Semua fitur ada di APK</span>";
  }
  if((d.masalah||[]).length){
    document.getElementById("ringkas").innerHTML +=
      "<div style=\"color:#f85149;margin-top:8px\"><b>Daftar masalah:</b><br>" +
      d.masalah.map(function(x){return esc(x)}).join("<br>") + "</div>";
  }
  var ada=(d.fitur||[]).filter(function(f){return f.ada});
  var hilang=(d.fitur||[]).filter(function(f){return !f.ada});
  var h="";
  ada.forEach(function(f){ h += "<div>✅ "+esc(f.nama)+"</div>"; });
  hilang.forEach(function(f){ h += "<div style=\"color:#f85149\">❌ "+esc(f.nama)+" (tidak ada di APK ini)</div>"; });
  document.getElementById("fitur").innerHTML = h || "";
}).catch(function(){
  // Cadangan: ambil info dari halaman rilis GitHub kalau build-info belum ada.
  fetch("https://api.github.com/repos/exbottod/voice-chat-room-real-time/releases/latest")
    .then(function(r){return r.json()}).then(function(d){
      var a=(d.assets||[])[0]||{};
      document.getElementById("ringkas").innerHTML =
        "Versi rilis <b>"+esc(d.tag_name||d.name||"?")+"</b> &middot; "+esc(viewMb(a.size))+" MB"+
        "<br><span style=\"color:#8b949e;font-size:12px\">Diunggah "+esc(d.published_at?new Date(d.published_at).toLocaleString("id-ID"):"-")+"</span>";
      document.getElementById("status").innerHTML="<span style=\"color:#d29922\">Data isi APK belum ada di build ini</span>";
    }).catch(function(){ document.getElementById("ringkas").textContent = "Belum ada data build."; });
});
function viewMb(n){ n=Number(n||0); return n?(n/1048576).toFixed(1):"?" }
</script>
</body></html>
