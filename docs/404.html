<script>
(function () {
  var base = '/voice-chat-room-real-time/';
  var m = location.pathname.match(/\/room\/([^\/?#]+)/);
  var q = new URLSearchParams(location.search).get('id');
  var id = (m && decodeURIComponent(m[1])) || q || '';
  location.replace(base + 'room/' + (id ? '?id=' + encodeURIComponent(id) : ''));
})();
</script>
</body></html>
