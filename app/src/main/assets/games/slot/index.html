<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Sloty</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./engine.js" defer></script>
    <script src="./script.js" defer></script>
<script>
window.addEventListener('load',function(){
  var t=document.getElementById('payTable');
  if(!t)return;
  var rows=[['🍓','42K'],['🍇','16.8K'],['🍑','10K'],['🍐','8.4K'],['🍊','8.4K'],['🍒','6.7K'],['🍎','2.1K'],['7️⃣','scatter']];
  t.innerHTML=rows.map(function(r){return '<div>'+r[0]+'<br>'+r[1]+'</div>';}).join('');
});
</script>
</head>
<body>
<div id="walletBar">
    <div class="wbRow"><span class="wbLabel">Saldo</span><span class="wbVal" id="wbBalance">0</span></div>
    <div class="wbMsg" id="wbMsg">Tekan Spin, dapatkan hadiahnya</div>
</div>
<style>
#walletBar{width:100%;max-width:460px;margin:0 auto 8px;padding:8px 10px;font-family:Arial,Helvetica,sans-serif;color:#fff}
#walletBar .wbRow{display:flex;justify-content:space-between;align-items:center;background:#2b0f45;border:2px solid #ffd54f;border-radius:14px;padding:6px 12px;font-weight:900}
#walletBar .wbLabel{font-size:12px;color:#ffe082}
#walletBar .wbVal{font-size:16px;color:#fff3c4;font-variant-numeric:tabular-nums}
#walletBar .wbChips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}
#walletBar .wbChip{background:linear-gradient(#fff,#e3f2fd);border:2px solid #0d47a1;border-radius:10px;padding:7px 0;font-size:12px;font-weight:900;color:#0d47a1}
#walletBar .wbChip.on{background:linear-gradient(#ff5252,#c62828);border-color:#7f0000;color:#fff}
#walletBar .wbMsg{text-align:center;font-size:12px;font-weight:800;color:#ffe082;margin-top:6px;min-height:16px}
#payTable{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:7px;font-size:10px;color:#ffe082;text-align:center}
#payTable div{background:#2b0f45;border:1px solid #7e57c2;border-radius:8px;padding:3px 0;line-height:1.3}
</style>


<div id="container">
    <div class="window-border">
        <div class="window">
            <div class="outer-spacer"></div>
            <div class="outer-col">
                <div class="col"></div>
            </div>
            <div class="outer-spacer"></div>
            <div class="outer-col">
                <div class="col"></div>
            </div>
            <div class="outer-spacer"></div>
            <div class="outer-col">
                <div class="col"></div>
            </div>
            <div class="outer-spacer"></div>
            <div class="outer-col">
                <div class="col"></div>
            </div>
            <div class="outer-spacer"></div>
            <div class="outer-col">
                <div class="col"></div>
            </div>
            <div class="outer-spacer"></div>
        </div>
    </div>

    <input type="button" onclick="spin(this)" class="start-button" value="Spin"/>
</div>

</body>
</html>
