name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    # Perubahan halaman/docs tidak perlu membangun ulang APK.
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-cleanup: on-success

      - name: Build release APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          AGORA_TOKEN_URL: ${{ secrets.AGORA_TOKEN_URL }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        shell: bash
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then echo "::warning::Secret GOOGLE_WEB_CLIENT_ID kosong, login Google tidak akan berfungsi"; fi
          if [ -z "$AGORA_APP_ID" ] || [ -z "$AGORA_TOKEN_URL" ]; then echo "::warning::Secret AGORA_* kosong, fitur suara tidak akan berfungsi"; fi
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Ringkasan error (hanya jika build gagal)
        if: failure()
        run: |
          echo "### Error build" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:|What went wrong|FAILED" -A4 build.log | head -80 >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Periksa isi APK
        if: success()
        env:
          VERSION_NAME: 1.0.${{ github.run_number }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}
        run: |
          APK=app/build/outputs/apk/release/app-universal-release.apk
          [ -f "$APK" ] || APK=app/build/outputs/apk/release/app-release.apk
          python3 scripts/apk_check.py "$APK" docs/build-info.json

      - name: Simpan APK versi lama untuk pembuat patch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p lama
          gh release download terbaru -p REZO-CHAT-VOICE-arm64.apk -O lama/arm64.apk >/dev/null 2>&1 || true
          gh release download terbaru -p REZO-CHAT-VOICE-armv7.apk -O lama/armv7.apk >/dev/null 2>&1 || true
          ls -la lama || true
          # Versi lama diambil dari commit, bukan dari file kerja: langkah
          # "Periksa isi APK" sudah menulis versi baru ke file kerja.
          git show HEAD:docs/build-info.json > /tmp/lama-info.json 2>/dev/null || echo '{}' > /tmp/lama-info.json
          python3 - <<'PY'
          import json
          v = ""
          try:
              v = json.load(open("/tmp/lama-info.json")).get("versi", "")
          except Exception:
              pass
          open("lama/versi.txt", "w").write(v or "")
          print("versi lama:", v)
          PY

      - name: Publikasikan APK terbaru ke Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          D=app/build/outputs/apk/release
          ls -la "$D"
          cp "$D/app-arm64-v8a-release.apk" REZO-CHAT-VOICE.apk
          cp "$D/app-arm64-v8a-release.apk" REZO-CHAT-VOICE-arm64.apk
          cp "$D/app-armeabi-v7a-release.apk" REZO-CHAT-VOICE-armv7.apk
          cp "$D/app-universal-release.apk" REZO-CHAT-VOICE-universal.apk
          # Nama berversi: file tidak pernah ditimpa build lain, jadi unduhan
          # tidak bisa terpotong di tengah jalan ("gagal mengurai paket").
          VER="1.0.${GITHUB_RUN_NUMBER}"
          cp "$D/app-arm64-v8a-release.apk" "REZO-CHAT-VOICE-$VER-arm64.apk"
          cp "$D/app-armeabi-v7a-release.apk" "REZO-CHAT-VOICE-$VER-armv7.apk"
          cp "$D/app-universal-release.apk" "REZO-CHAT-VOICE-$VER-universal.apk"
          NOTES="Versi $VER (commit ${GITHUB_SHA::7}). Pakai REZO-CHAT-VOICE-$VER-arm64.apk untuk HP baru, $VER-armv7 untuk HP lama 32-bit, $VER-universal kalau ragu. Kalau pemasangan gagal, hapus APK lama di folder Download lalu unduh ulang."
          BERKAS="REZO-CHAT-VOICE.apk REZO-CHAT-VOICE-arm64.apk REZO-CHAT-VOICE-armv7.apk REZO-CHAT-VOICE-universal.apk REZO-CHAT-VOICE-$VER-arm64.apk REZO-CHAT-VOICE-$VER-armv7.apk REZO-CHAT-VOICE-$VER-universal.apk"
          if gh release view terbaru >/dev/null 2>&1; then
            gh release upload terbaru $BERKAS --clobber
            gh release edit terbaru --notes "$NOTES" --latest
          else
            gh release create terbaru $BERKAS --title "REZO CHAT VOICE (terbaru)" --notes "$NOTES" --latest
          fi

      - name: Catat error kalau build gagal
        if: failure()
        env:
          VERSION_NAME: 1.0.${{ github.run_number }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re
          pesan = []
          try:
              log = open("build.log", errors="ignore").read()
          except Exception:
              log = ""
          for baris in log.splitlines():
              if re.match(r"^(e: |error:|FAILED|\* What went wrong)", baris.strip()):
                  pesan.append(baris.strip()[:200])
              if len(pesan) >= 25:
                  break
          info = {
              "status": "gagal",
              "masalah": pesan or ["Build gagal, buka riwayat build untuk detail."],
              "versi": os.environ.get("VERSION_NAME", ""),
              "ukuran_mb": 0,
              "sha256": "",
              "commit": (os.environ.get("GITHUB_SHA") or "")[:7],
              "waktu": os.environ.get("BUILD_TIME") or "",
              "workflow": os.environ.get("GITHUB_SERVER_URL", "https://github.com") + "/" + (os.environ.get("GITHUB_REPOSITORY") or "") + "/actions",
              "aset_roket": 0,
              "aset_total": 0,
              "fitur": [],
          }
          os.makedirs("docs", exist_ok=True)
          json.dump(info, open("docs/build-info.json", "w"), indent=2, ensure_ascii=False)
          PYEOF

      - name: Unduh APK dasar lama (beberapa versi)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dasar
          # APK dasar disimpan per versi supaya pengguna yang melewatkan satu
          # versi tetap dapat patch kecil, bukan APK penuh.
          gh release download terbaru -p 'base-*.apk' -D dasar --clobber >/dev/null 2>&1 || true

      - name: Buat file selisih (patch) update kecil
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -e
          pip install --quiet bsdiff4
          D=app/build/outputs/apk/release
          VLAMA=$(cat lama/versi.txt 2>/dev/null || echo "")
          buat() {  # $1=arch $2=berkas lama $3=versi lama
            [ -f "$2" ] || return 0
            [ "$3" = "$VERSION_NAME" ] && return 0
            case "$1" in
              arm64) BARU="$D/app-arm64-v8a-release.apk" ;;
              armv7) BARU="$D/app-armeabi-v7a-release.apk" ;;
            esac
            python3 scripts/buat_patch.py --lama "$2" --baru "$BARU" --kunci "$1" \
              --keluaran "patch-${3}-to-${VERSION_NAME}-${1}.bin" \
              --versi-lama "$3" --versi-baru "$VERSION_NAME" --json docs/patch-info.json || true
          }
          for ARCH in arm64 armv7; do
            # 1) versi tepat sebelum ini (paling sering dipakai)
            buat "$ARCH" "lama/${ARCH}.apk" "$VLAMA"
            # 2) versi-versi dasar lain yang masih disimpan
            for F in dasar/base-*-${ARCH}.apk; do
              [ -f "$F" ] || continue
              V=$(basename "$F" | sed -E 's/^base-(.+)-'"$ARCH"'\.apk$/\1/')
              buat "$ARCH" "$F" "$V"
            done
          done
          ls -l patch-*.bin 2>/dev/null || echo "Tidak ada patch yang dibuat."
          shopt -s nullglob
          BERKAS=(patch-*.bin)
          if [ ${#BERKAS[@]} -gt 0 ]; then
            gh release upload terbaru "${BERKAS[@]}" --clobber
          fi

      - name: Simpan APK dasar versi ini
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          D=app/build/outputs/apk/release
          cp "$D/app-arm64-v8a-release.apk" "base-${VERSION_NAME}-arm64.apk" 2>/dev/null || true
          cp "$D/app-armeabi-v7a-release.apk" "base-${VERSION_NAME}-armv7.apk" 2>/dev/null || true
          shopt -s nullglob
          SIMPAN=(base-${VERSION_NAME}-*.apk)
          if [ ${#SIMPAN[@]} -gt 0 ]; then
            gh release upload terbaru "${SIMPAN[@]}" --clobber >/dev/null 2>&1 || true
          fi
          # Simpan hanya 3 versi dasar terbaru supaya rilis tidak membengkak.
          python3 - <<'PYBASE'
          import json, os, re, subprocess
          keluar = subprocess.run(["gh", "release", "view", "terbaru", "--json", "assets"],
                                  capture_output=True, text=True)
          try:
              aset = [a["name"] for a in json.loads(keluar.stdout or "{}").get("assets", [])]
          except Exception:
              aset = []
          versi = sorted({m.group(1) for n in aset for m in [re.match(r"^base-(.+)-(arm64|armv7)\.apk$", n)] if m},
                         key=lambda v: int(str(v).split(".")[-1]) if str(v).split(".")[-1].isdigit() else 0,
                         reverse=True)
          buang = versi[3:]
          for v in buang:
              for arch in ("arm64", "armv7"):
                  nama = "base-%s-%s.apk" % (v, arch)
                  if nama in aset:
                      subprocess.run(["gh", "release", "delete-asset", "terbaru", nama, "--yes"],
                                     capture_output=True)
          print("APK dasar disimpan:", versi[:3])
          PYBASE

      - name: Simpan hasil cek ke halaman web
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain docs/build-info.json)" ]; then echo "Tidak ada perubahan."; exit 0; fi
          git config user.name "rezo-bot"
          git config user.email "rezo-bot@users.noreply.github.com"
          # Tulis info build di atas commit terbaru remote. Cara lama memakai
          # "git pull --rebase" dan gagal total saat ada commit bersamaan,
          # sehingga versi baru tidak pernah terdeteksi aplikasi.
          cp docs/build-info.json /tmp/build-info.json
          [ -f docs/patch-info.json ] && cp docs/patch-info.json /tmp/patch-info.json || true
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard FETCH_HEAD
            cp /tmp/build-info.json docs/build-info.json
            [ -f /tmp/patch-info.json ] && cp /tmp/patch-info.json docs/patch-info.json || true
            git add docs/build-info.json
            [ -f docs/patch-info.json ] && git add docs/patch-info.json || true
            git commit -q -m "Perbarui isi APK 1.0.${GITHUB_RUN_NUMBER} [skip ci]" || true
            if git push -q origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "Info build tersimpan."
              exit 0
            fi
            sleep 8
          done
          echo "Gagal menyimpan info build, tapi APK sudah diunggah."
          exit 0
