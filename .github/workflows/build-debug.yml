name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-cleanup: on-success

      - name: Build release APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          AGORA_TOKEN_URL: ${{ secrets.AGORA_TOKEN_URL }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        shell: bash
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then echo "::warning::Secret GOOGLE_WEB_CLIENT_ID kosong, login Google tidak akan berfungsi"; fi
          if [ -z "$AGORA_APP_ID" ] || [ -z "$AGORA_TOKEN_URL" ]; then echo "::warning::Secret AGORA_* kosong, fitur suara tidak akan berfungsi"; fi
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Ringkasan error (hanya jika build gagal)
        if: failure()
        run: |
          echo "### Error build" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:|What went wrong|FAILED" -A4 build.log | head -80 >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publikasikan APK terbaru ke Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk REZO-CHAT-VOICE.apk
          NOTES="Build otomatis dari commit ${GITHUB_SHA::7}"
          if gh release view terbaru >/dev/null 2>&1; then
            gh release upload terbaru REZO-CHAT-VOICE.apk --clobber
            gh release edit terbaru --notes "$NOTES" --latest
          else
            gh release create terbaru REZO-CHAT-VOICE.apk --title "REZO CHAT VOICE (terbaru)" --notes "$NOTES" --latest
          fi
