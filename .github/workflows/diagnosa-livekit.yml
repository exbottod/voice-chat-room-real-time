name: Diagnosa LiveKit
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/diagnosa-livekit.yml"]
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          PASS: ${{ secrets.VPS_PASSWORD || secrets.VPS_PASSWORDS || secrets.VPS_PASS || secrets.VPS_ROOT_PASSWORD }}
        run: |
          sudo apt-get update -qq; sudo apt-get install -y -qq sshpass >/dev/null
          OPSI="-o StrictHostKeyChecking=no -o ConnectTimeout=25 -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          S='echo "== layanan"; systemctl is-active rezo-livekit rezo-lktoken; echo "== port"; ss -lntup | grep -E ":7880|:7881|:50000" ; echo "== ufw"; ufw status 2>/dev/null | head -5; echo "== iptables"; iptables -S INPUT | head -10; echo "== log"; journalctl -u rezo-livekit -n 25 --no-pager | tail -25; echo "== tcp lokal"; timeout 5 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/7881" && echo "7881 lokal terbuka" || echo "7881 lokal tertutup"'
          mkdir -p hasil
          OUT=hasil/lk-cek-${{ github.run_number }}.txt
          { printf '%s\n' "$PASS" | sshpass -p "$PASS" ssh $OPSI ubuntu@43.156.99.4 "sudo -S -p '' bash -c '$S'"; } > $OUT 2>&1 || true
          cat $OUT
      - run: |
          git config user.email dev@rezo.app; git config user.name "REZO Build"
          git add hasil; git commit -m "chore: diagnosa livekit" || true
          git push || git pull -q --rebase origin main && git push || true
