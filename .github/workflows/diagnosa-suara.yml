name: Diagnosa suara
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnosa-suara.yml"
      - "vps/diagnosa.sh"
      - "vps/perbaiki-sertifikat.sh"
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baca konfigurasi suara di VPS
        env:
          PASS: ${{ secrets.VPS_PASSWORD || secrets.VPS_PASSWORDS || secrets.VPS_PASS || secrets.VPS_ROOT_PASSWORD }}
        run: |
          sudo apt-get update -qq; sudo apt-get install -y -qq sshpass >/dev/null
          OPSI="-o StrictHostKeyChecking=no -o ConnectTimeout=25 -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          SKRIP=$(cat vps/perbaiki-sertifikat.sh vps/diagnosa.sh | base64 -w0)
          PERIKSA="echo $SKRIP | base64 -d | bash"
          { printf '%s\n' "$PASS" | sshpass -p "$PASS" ssh $OPSI ubuntu@43.156.99.4 "sudo -S -p '' bash -c '$PERIKSA'"; } > hasil-suara.txt 2>&1 \
            || sshpass -p "$PASS" ssh $OPSI root@43.156.99.4 "bash -c '$PERIKSA'" > hasil-suara.txt 2>&1 \
            || true
          cat hasil-suara.txt
      - name: Simpan hasil ke repo
        run: |
          git config user.email dev@rezo.app
          git config user.name "REZO Build"
          git add hasil-suara.txt
          git commit -m "chore: hasil diagnosa suara" || true
          git push || true
