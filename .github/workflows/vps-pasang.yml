name: Pasang layanan VPS
on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: Email admin panel (login Google)
        default: developerex100@gmail.com
        required: true
jobs:
  pasang:
    runs-on: ubuntu-latest
    steps:
      - name: Sambung ke VPS dan jalankan pembaruan
        env:
          PASS: ${{ secrets.VPS_PASSWORD }}
          GH_TOKEN: ${{ secrets.PANEL_GITHUB_TOKEN }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
        run: |
          set -u
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          ALAMAT=43.156.99.4
          SKRIP=https://raw.githubusercontent.com/exbottod/voice-chat-room-real-time/main/vps/aset.sh
          OPSI="-o StrictHostKeyChecking=no -o ConnectTimeout=25 -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          if [ -z "${PASS}" ]; then echo "::error::Secret VPS_PASSWORD kosong."; exit 1; fi
          if [ -z "${GH_TOKEN}" ]; then echo "::error::Secret PANEL_GITHUB_TOKEN kosong."; exit 1; fi

          echo "== Mencoba user root"
          if sshpass -p "$PASS" ssh $OPSI root@$ALAMAT \
               "ADMIN_EMAIL='$ADMIN_EMAIL' GH_TOKEN='$GH_TOKEN' bash -c 'curl -fsSL $SKRIP | bash'"; then
            echo "Selesai sebagai root."; exit 0
          fi
          echo "::warning::Login root gagal, mencoba user ubuntu dengan sudo."

          echo "== Mencoba user ubuntu + sudo"
          if printf '%s\n' "$PASS" | sshpass -p "$PASS" ssh $OPSI ubuntu@$ALAMAT \
               "sudo -S -p '' ADMIN_EMAIL='$ADMIN_EMAIL' GH_TOKEN='$GH_TOKEN' bash -c 'curl -fsSL $SKRIP | bash'"; then
            echo "Selesai sebagai ubuntu."; exit 0
          fi
          echo "::error::Kedua cara login gagal. Periksa isi secret VPS_PASSWORD (harus password login VPS)."
          exit 1
